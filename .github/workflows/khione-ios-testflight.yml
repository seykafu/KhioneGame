# Builds the Khione iOS app (khione-mobile/native) on GitHub's macOS runners and
# uploads it to TestFlight. Needs these repository secrets (Settings → Secrets and
# variables → Actions):
#   APPLE_TEAM_ID   your Apple Developer team ID (10 characters)
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      full contents of the AuthKey_XXXX.p8 file (Admin access, so
#                   Xcode can create the distribution certificate for you)
# Optional repository variable: IOS_BUNDLE_ID (defaults to com.kasey.khione).
name: Khione iOS → TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main, claude/vibrant-swanson-6f32ca]
    paths:
      - "khione-mobile/app/public/**"
      - "khione-mobile/native/**"
      - ".github/workflows/khione-ios-testflight.yml"

concurrency:
  group: khione-ios-testflight
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$TEAM" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple signing secrets are not set yet, so the TestFlight build is skipped."
          fi

  testflight:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: khione-mobile/native
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.kasey.khione' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy the game into the app
        run: |
          npm ci
          npx cap copy ios

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Khione.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee -a "$RUNNER_TEMP/xcode.log"

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Khione.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee -a "$RUNNER_TEMP/xcode.log"

      # Job logs need a GitHub sign-in to read; annotations show on the run page
      # (and via the public API), so surface Xcode's own error lines there.
      - name: Report Xcode errors
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/xcode.log" ] || exit 0
          grep -E "error:|Error Domain|No profiles|No Accounts|requires a provisioning|is not available|Signing for" "$RUNNER_TEMP/xcode.log" \
            | sort -u | head -15 | while IFS= read -r line; do echo "::error::${line:0:600}"; done

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
